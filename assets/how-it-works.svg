<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" font-family="Segoe UI, ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title>How OpenCode Model Router works</title>
  <desc>Request enters the per-agent chain: primary, secondary, tertiary. The first model that responds returns the answer; total failure surfaces an error.</desc>
  <defs>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9aa3a6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4cc38a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e5484d"/>
    </marker>
  </defs>

  <!-- ground -->
  <rect x="0" y="0" width="1600" height="520" fill="#0b0d0e"/>

  <!-- header -->
  <text x="80" y="64" font-size="22" font-weight="700" fill="#e6e8e9">How it works</text>
  <text x="1520" y="64" text-anchor="end" font-size="15" fill="#9aa3a6">primary &#8594; secondary &#8594; tertiary</text>

  <!-- request node -->
  <rect x="80" y="111" width="160" height="58" rx="10" fill="#121516" stroke="#1f2426" stroke-width="1.5"/>
  <text x="160" y="147" text-anchor="middle" font-size="20" font-weight="600" fill="#e6e8e9">Request</text>
  <line x1="244" y1="140" x2="289" y2="140" stroke="#9aa3a6" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

  <!-- tier 1 -->
  <rect x="296" y="111" width="270" height="58" rx="10" fill="#121516" stroke="#1f2426" stroke-width="1.5"/>
  <text x="431" y="147" text-anchor="middle" font-size="20" font-weight="600" fill="#e6e8e9">1 Primary</text>
  <line x1="431" y1="173" x2="431" y2="284" stroke="#4cc38a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="445" y="234" font-size="13" fill="#4cc38a">responds</text>
  <rect x="341" y="288" width="180" height="54" rx="10" fill="#121516" stroke="#4cc38a" stroke-width="1.5"/>
  <text x="431" y="322" text-anchor="middle" font-size="19" font-weight="600" fill="#4cc38a">Answer</text>

  <!-- tier 1 fails to tier 2 -->
  <line x1="570" y1="140" x2="615" y2="140" stroke="#9aa3a6" stroke-width="1.5" marker-end="url(#arrow-muted)"/>
  <text x="592" y="124" text-anchor="middle" font-size="13" fill="#9aa3a6">fails</text>

  <!-- tier 2 -->
  <rect x="622" y="111" width="270" height="58" rx="10" fill="#121516" stroke="#1f2426" stroke-width="1.5"/>
  <text x="757" y="147" text-anchor="middle" font-size="20" font-weight="600" fill="#e6e8e9">2 Secondary</text>
  <line x1="757" y1="173" x2="757" y2="284" stroke="#4cc38a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="771" y="234" font-size="13" fill="#4cc38a">responds</text>
  <rect x="667" y="288" width="180" height="54" rx="10" fill="#121516" stroke="#4cc38a" stroke-width="1.5"/>
  <text x="757" y="322" text-anchor="middle" font-size="19" font-weight="600" fill="#4cc38a">Answer</text>

  <!-- tier 2 fails to tier 3 -->
  <line x1="896" y1="140" x2="941" y2="140" stroke="#9aa3a6" stroke-width="1.5" marker-end="url(#arrow-muted)"/>
  <text x="918" y="124" text-anchor="middle" font-size="13" fill="#9aa3a6">fails</text>

  <!-- tier 3 -->
  <rect x="948" y="111" width="270" height="58" rx="10" fill="#121516" stroke="#1f2426" stroke-width="1.5"/>
  <text x="1083" y="147" text-anchor="middle" font-size="20" font-weight="600" fill="#e6e8e9">3 Tertiary</text>
  <line x1="1083" y1="173" x2="1083" y2="284" stroke="#4cc38a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="1097" y="234" font-size="13" fill="#4cc38a">responds</text>
  <rect x="993" y="288" width="180" height="54" rx="10" fill="#121516" stroke="#4cc38a" stroke-width="1.5"/>
  <text x="1083" y="322" text-anchor="middle" font-size="19" font-weight="600" fill="#4cc38a">Answer</text>

  <!-- tier 3 fails to error -->
  <line x1="1222" y1="140" x2="1267" y2="140" stroke="#e5484d" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="1245" y="124" text-anchor="middle" font-size="13" fill="#e5484d">fails</text>

  <!-- surface error -->
  <rect x="1274" y="111" width="240" height="58" rx="10" fill="#121516" stroke="#e5484d" stroke-width="1.5"/>
  <text x="1394" y="147" text-anchor="middle" font-size="20" font-weight="600" fill="#e5484d">Surface error</text>

  <!-- notes -->
  <line x1="80" y1="406" x2="1520" y2="406" stroke="#1f2426" stroke-width="1"/>
  <rect x="80" y="441" width="8" height="8" rx="2" fill="#4cc38a"/>
  <text x="100" y="452" font-size="17" fill="#9aa3a6">Chains are stored in one JSON state file</text>
  <rect x="80" y="475" width="8" height="8" rx="2" fill="#4cc38a"/>
  <text x="100" y="486" font-size="17" fill="#9aa3a6">Managed from a local web UI at 127.0.0.1:37337</text>
  <text x="1520" y="486" text-anchor="end" font-size="14" fill="#9aa3a6">OpenCode Model Router</text>
</svg>
